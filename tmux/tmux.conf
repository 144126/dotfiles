# tmux as foot's "tabs" — windows = tabs
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "foot"
set -ga terminal-overrides ",foot:Tc"   # truecolor
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g history-limit 50000

# tab-like keys: Ctrl+t new, Ctrl+PgUp/PgDn switch, Ctrl+w close
bind -n C-t new-window
bind -n C-Pageup previous-window
bind -n C-Pagedown next-window
bind -n C-z previous-window
bind -n C-x next-window
bind -n C-w kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Ctrl+Q reaches pi's dictation toggle even while scrolled (mouse-wheel scroll
# auto-enters tmux copy-mode, which otherwise swallows all keystrokes).
bind-key -T copy-mode C-q send-keys -X cancel \; send-keys C-q

# prefix + i toggles the claude session info pane on the right
bind-key i run-shell -b "~/.claude/statusline.sh toggle #{pane_id}"

# persistence across reboots (tpm + resurrect/continuum)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-processes '"~claude->claude --continue" "~opencode->opencode --continue" "~pnpm run dev->PORT=3690 pnpm run dev 2>&1 | tee .log" "~PORT=3690 pnpm run dev->PORT=3690 pnpm run dev 2>&1 | tee .log" pi codex grok ollama btop'
run '~/.tmux/plugins/tpm/tpm'

# clickable hyperlinks (OSC 8) in foot+tmux — needed for markdown [text](url)
set -g allow-passthrough on
set -g set-clipboard on

# FIX: foot+tmux hyperlinks need terminal-features, not just allow-passthrough
set -as terminal-features ",foot*:hyperlinks"
# also ensure 24-bit color stays
set -as terminal-overrides ",foot*:Tc"

# FIX 2: make OSC8 hyperlinks actually clickable in tmux+foot
# tmux with mouse on intercepts clicks, so foot never sees them.
# Need tmux to handle hyperlink clicks itself via mouse_hyperlink [mouse_hyperlink doesn't work properly with wide glyphs · Issue #4425](https://github.com/tmux/tmux/issues/4425)
# also handle drag-less click on pane (some terminals send MouseDown)

# Ctrl+click opens OSC8 hyperlink - preserves normal click for selection [mouse_hyperlink doesn't work properly with wide glyphs · Issue #4425](https://github.com/tmux/tmux/issues/4425)


# Ctrl+click opens OSC8 hyperlink - tmux mouse on blocks foot, so handle in tmux [mouse_hyperlink doesn't work properly with wide glyphs · Issue #4425](https://github.com/tmux/tmux/issues/4425)
unbind-key -T root C-MouseDown1Pane
bind-key -T root C-MouseUp1Pane if-shell -F "#{mouse_hyperlink}" "run-shell -b \"xdg-open '#{mouse_hyperlink}' >/dev/null 2>&1 &\"" ""